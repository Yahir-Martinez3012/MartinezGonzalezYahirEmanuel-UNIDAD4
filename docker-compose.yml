services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conecta_utc}
      POSTGRES_USER: ${POSTGRES_USER:-conecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: .
    environment: &django_environment
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      DEBUG: "False"
      DATABASE_URL: ${DATABASE_URL:-postgresql://conecta:${POSTGRES_PASSWORD}@db:5432/conecta_utc}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_SSL_REDIRECT: "False"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
    networks:
      - backend
    restart: "no"

  app1:
    build: .
    environment:
      <<: *django_environment
      INSTANCE_ID: app1
      APP_VERSION: ${APP_VERSION:-desarrollo}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/staticfiles:ro
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 35s

  app2:
    build: .
    environment:
      <<: *django_environment
      INSTANCE_ID: app2
      APP_VERSION: ${APP_VERSION:-desarrollo}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/staticfiles:ro
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 35s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 10
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  static_data:
