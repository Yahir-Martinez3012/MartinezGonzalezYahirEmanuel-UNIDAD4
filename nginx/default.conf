upstream django_backend {
    # Nginx usa Round Robin por defecto. El servidor se excluye temporalmente
    # tras un fallo de conexión/timeout; una solicitud en curso puede fallar al detectar la caída.
    server app1:8000 max_fails=1 fail_timeout=5s;
    server app2:8000 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
